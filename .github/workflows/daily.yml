name: Daily EU news post

on:
  schedule:
    # Futási időpontok magyar idő szerint: 06:00, 11:00, 13:45, 15:35, 18:00, 20:00, 22:00.
    # A cron UTC-ben megy, ezért a nyári (UTC+2) és a téli (UTC+1) eltolás is szerepel;
    # a bot.py a budapesti óra alapján csak a valódi időpontban dolgozik (a többi futás azonnal kilép).
    - cron: "0 4,5 * * *"      # 06:00
    - cron: "0 9,10 * * *"     # 11:00
    - cron: "45 11,12 * * *"   # 13:45
    - cron: "35 13,14 * * *"   # 15:35
    - cron: "0 16,17 * * *"    # 18:00
    - cron: "0 18,19 * * *"    # 20:00
    - cron: "0 20,21 * * *"    # 22:00
  workflow_dispatch:       # kézi indítás is lehetséges
    inputs:
      dry_run:
        description: "DRY_RUN (nem pushol képet, nem posztol)"
        type: boolean
        default: true
      max_per_run:
        description: "Max. ennyi cikket posztol (az ütemezett futás mindent, max. 20-at)"
        default: "1"

permissions:
  contents: write

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: self-hosted   # a saját gépen futó GitHub runner (a Telex tiltja a GitHub szervereit)
    defaults:
      run:
        shell: bash          # Windows-on a Git for Windows bash-át használja
    steps:
      - uses: actions/checkout@v4

      # a saját gépen a rendszer python3-ját használjuk egy virtuális környezetben
      # (az actions/setup-python macOS-en /Users/runner-be telepítene, ahhoz nincs jog)
      - name: Python env
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet --upgrade pip
          .venv/bin/pip install --quiet requests beautifulsoup4 lxml pillow

      - name: Git identity
        run: |
          git config user.name "eu-bot"
          git config user.email "eu-bot@users.noreply.github.com"

      - name: Run bot
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          RAW_BASE: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}
          MAX_PER_RUN: ${{ inputs.max_per_run || '20' }}
          SCHEDULED: ${{ github.event_name == 'schedule' && '1' || '' }}
        run: .venv/bin/python bot.py

      - name: Upload cards (DRY_RUN)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        uses: actions/upload-artifact@v4
        with:
          name: cards
          path: images/

      - name: Commit state
        if: always() && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        run: |
          git add posted.json || true
          if ! git diff --cached --quiet; then
            git commit -m "update posted.json"
            git pull --rebase --autostash --quiet
            git push
          fi
