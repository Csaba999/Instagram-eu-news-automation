name: Daily EU news post

on:
  schedule:
    # Futási időpontok magyar idő szerint: 06:00, 11:00, 13:45, 15:35, 18:00, 21:00, 22:00.
    # A cron UTC-ben megy, ezért a nyári (UTC+2) és a téli (UTC+1) eltolás is szerepel.
    # Ha a Mac alszik, a GitHub (max. 24 óráig) sorban tartja a futást, és ébredéskor lefut;
    # a bot.py a last_slot.txt alapján minden időpontot egyszer dolgoz fel.
    - cron: "45 11,12 * * *"   # 13:45
    - cron: "0 16,17 * * *"    # 18:00
    - cron: "0 19,20 * * *"    # 21:00
  workflow_dispatch:       # kézi indítás is lehetséges
    inputs:
      dry_run:
        description: "DRY_RUN (nem pushol képet, nem posztol)"
        type: boolean
        default: true
      ai_test:
        description: "Csak az AI-szűrő próbája a legutóbbi cikkeken (nem posztol)"
        type: boolean
        default: false
      max_per_run:
        description: "Max. ennyi cikket posztol (napi limit: 1 poszt)"
        default: "1"
      scheduled:
        description: "Ütemezett futásként viselkedjen (a Mac időzítője ezzel indítja)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: daily-post
  cancel-in-progress: false

jobs:
  post:
    runs-on: self-hosted   # a saját gépen futó GitHub runner (a Telex tiltja a GitHub szervereit)
    defaults:
      run:
        shell: bash          # Windows-on a Git for Windows bash-át használja
    steps:
      - uses: actions/checkout@v4

      # a saját gépen a rendszer python3-ját használjuk egy virtuális környezetben
      # (az actions/setup-python macOS-en /Users/runner-be telepítene, ahhoz nincs jog)
      - name: Python env
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --quiet --upgrade pip
          .venv/bin/pip install --quiet requests beautifulsoup4 lxml pillow

      - name: Git identity
        run: |
          git config user.name "eu-bot"
          git config user.email "eu-bot@users.noreply.github.com"

      - name: Run bot
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_TOKEN: ${{ secrets.IG_TOKEN }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RAW_BASE: https://raw.githubusercontent.com/${{ github.repository }}/${{ github.ref_name }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && '1' || '' }}
          MAX_PER_RUN: ${{ inputs.max_per_run || '20' }}
          SCHEDULED: ${{ (github.event_name == 'schedule' || inputs.scheduled) && '1' || '' }}
          AI_TEST: ${{ github.event_name == 'workflow_dispatch' && inputs.ai_test && '1' || '' }}
        run: .venv/bin/python bot.py

      - name: Upload cards (DRY_RUN)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        uses: actions/upload-artifact@v4
        with:
          name: cards
          path: images/

      - name: Commit state
        if: always() && !(github.event_name == 'workflow_dispatch' && inputs.dry_run)
        run: |
          for f in posted.json last_slot.txt daily_count.json; do if [ -f "$f" ]; then git add "$f"; fi; done
          if ! git diff --cached --quiet; then
            git commit -m "update state"
            git pull --rebase --autostash --quiet
            git push
          fi
